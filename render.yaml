services:
  - type: web
    name: rohan-kapoor
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: NOTIFY_EMAIL
        value: hello@rohankapoor.photo